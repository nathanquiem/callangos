services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: callangos
      POSTGRES_USER: callangos
      POSTGRES_PASSWORD: ${CALLANGOS_LOCAL_DB_PASSWORD:?Defina CALLANGOS_LOCAL_DB_PASSWORD}
    ports:
      - "54329:5432"
    volumes:
      - callangos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callangos -d callangos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  callangos_postgres:
